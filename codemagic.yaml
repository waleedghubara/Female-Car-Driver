workflows:
  ios-testflight:
    name: Female Car Driver iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: App Apple

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    environment:
      groups:
        - ios-signing
      vars:
        BUNDLE_ID: com.femalecardriverapp.eon
        APP_ENV: production
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.femalecardriverapp.eon
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install Flutter dependencies
        script: |
          set -e
          flutter --version
          flutter pub get

      - name: Run Flutter tests
        script: |
          set -e
          flutter test

      - name: Verify iOS project and bundle identifier
        script: |
          set -e
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Podfile
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" \
            ios/Runner.xcodeproj/project.pbxproj

      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd ios
          pod install

      - name: Configure Xcode signing
        script: |
          set -e
          xcode-project use-profiles
          test -s "$HOME/export_options.plist"

          set -o pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings |
            grep -E \
            "PRODUCT_BUNDLE_IDENTIFIER =|CODE_SIGN_IDENTITY =|PROVISIONING_PROFILE_SPECIFIER ="

      - name: Determine build number
        script: |
          set -e

          APP_JSON=$(app-store-connect apps list --json \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier)

          APP_STORE_CONNECT_APP_ID=$(
            printf '%s' "$APP_JSON" |
              python3 -c '
          import json
          import os
          import sys

          bundle_id = os.environ["BUNDLE_ID"]
          payload = json.load(sys.stdin)
          matches = set()

          def collect_apps(value):
              if isinstance(value, dict):
                  attributes = value.get("attributes")
                  if (
                      isinstance(attributes, dict)
                      and attributes.get("bundleId") == bundle_id
                      and str(value.get("id", "")).isdigit()
                  ):
                      matches.add(str(value["id"]))
                  for child in value.values():
                      collect_apps(child)
              elif isinstance(value, list):
                  for child in value:
                      collect_apps(child)

          collect_apps(payload)
          if len(matches) != 1:
              raise SystemExit(
                  f"ERROR: Expected one App Store Connect app for {bundle_id}, "
                  f"found {len(matches)}. Check the app record and API access."
              )
          print(matches.pop())
          '
          )

          echo "App Store Connect app ID: $APP_STORE_CONNECT_APP_ID"
          LATEST_BUILD=$(app-store-connect get-latest-app-store-build-number \
            "$APP_STORE_CONNECT_APP_ID")

          if ! [[ "$LATEST_BUILD" =~ ^[0-9]+$ ]]; then
            echo "ERROR: App Store Connect returned an invalid latest build number: $LATEST_BUILD"
            exit 1
          fi

          NEW_BUILD=$((LATEST_BUILD + 1))
          echo "Building $BUNDLE_ID with build number $NEW_BUILD"
          echo "NEW_BUILD=$NEW_BUILD" >> "$CM_ENV"

      - name: Build signed iOS IPA
        script: |
          set -e
          flutter build ipa \
            --release \
            --build-number="$NEW_BUILD" \
            --export-options-plist="$HOME/export_options.plist" \
            --dart-define=APP_ENV="$APP_ENV"

      - name: Verify IPA artifact
        script: |
          set -e
          IPA_DIR="build/ios/ipa"
          test -d "$IPA_DIR"
          IPA_FILE=$(find "$IPA_DIR" -maxdepth 1 -name "*.ipa" -print -quit)
          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: No IPA was generated in $IPA_DIR"
            exit 1
          fi
          ls -lh "$IPA_FILE"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
